<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGUAR PRODUCTION - Dashboard</title>
    
    <!-- โหลดไลบรารี SheetJS สำหรับทำ Excel แยก Sheet (ตัวนี้จะแก้ Error ที่เคยเจอครับ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        /* สไตล์เบื้องต้นให้คุมโทน Stock Board ดำ-เขียว */
        body { background-color: #000; color: #fff; font-family: sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: center; }
        th { background-color: #111; color: #00ff00; } /* หัวตารางสีเขียว */
        
        .action-bar { margin: 20px 0; }
        .btn { 
            padding: 10px 20px; 
            margin-right: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            border: none; 
            border-radius: 4px;
        }
        .btn-excel { background-color: #1d6f42; color: white; }
        .btn-sort { background-color: #444; color: white; border: 1px solid #00ff00; }
        .btn-sort:hover { background-color: #00ff00; color: #000; }
    </style>
</head>
<body>

    <div style="padding: 20px;">
        <!-- แถบปุ่มกด -->
        <div class="action-bar">
            <button class="btn btn-excel" onclick="exportExcel()">📥 EXCEL EXPORT (แยก Sheet)</button>
            <!-- ปุ่มเรียงข้อมูล โดยผมตั้งต้นให้เรียงตามคอลัมน์ Order No. (คอลัมน์ที่ 2) -->
            <button class="btn btn-sort" onclick="sortTable(1)">🔃 SORT DATA (เรียงตาม Order No)</button>
        </div>

        <!-- ตารางข้อมูล (สมมติข้อมูลขึ้นมาให้เห็นภาพ) -->
        <table id="productionTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Order No</th>
                    <th>Part No</th>
                    <th>QTY</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>07/10/2026</td><td>MOMTC-261001</td><td>PART-A</td><td>500</td></tr>
                <tr><td>07/10/2026</td><td>MOBCN-261005</td><td>PART-B</td><td>300</td></tr>
                <tr><td>06/10/2026</td><td>MOMTN-261002</td><td>PART-C</td><td>1200</td></tr>
                <tr><td>06/10/2026</td><td>MOBCC-261008</td><td>PART-D</td><td>150</td></tr>
                <tr><td>05/10/2026</td><td>MOMTC-261009</td><td>PART-E</td><td>800</td></tr>
                <tr><td>05/10/2026</td><td>SPECIAL-001</td><td>PART-F</td><td>50</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. ฟังก์ชันเรียงลำดับข้อมูล (Sort Data) ในตาราง HTML
        // ----------------------------------------------------
        let sortAscending = true;
        
        function sortTable(columnIndex) {
            const table = document.getElementById("productionTable");
            const tbody = table.querySelector("tbody");
            const rows = Array.from(tbody.querySelectorAll("tr"));

            rows.sort((a, b) => {
                const cellA = a.cells[columnIndex].innerText.trim();
                const cellB = b.cells[columnIndex].innerText.trim();

                if (cellA < cellB) return sortAscending ? -1 : 1;
                if (cellA > cellB) return sortAscending ? 1 : -1;
                return 0;
            });

            // สลับทิศทาง (มากไปน้อย / น้อยไปมาก) สำหรับการกดปุ่มครั้งถัดไป
            sortAscending = !sortAscending;

            // นำแถวที่เรียงแล้วกลับไปใส่ในตาราง
            rows.forEach(row => tbody.appendChild(row));
        }

        // ----------------------------------------------------
        // 2. ฟังก์ชัน Export Excel แยก Sheet ตามคำนำหน้า Order No
        // ----------------------------------------------------
        function exportExcel() {
            const table = document.getElementById("productionTable");
            const rows = table.querySelectorAll("tr");
            
            // กำหนดชื่อ Sheet ที่ต้องการจับกลุ่ม
            const sheetNames = ["MOMTC", "MOMTN", "MOMTB", "MOBCC", "MOBCN", "MOBCB", "Others"];
            const dataGroups = {};
            
            // ดึงข้อมูลหัวตาราง (Header)
            const headers = [];
            const headerCells = rows[0].querySelectorAll("th");
            headerCells.forEach(th => headers.push(th.innerText));

            // สร้าง Array เตรียมเก็บข้อมูลของแต่ละ Sheet โดยบรรทัดแรกใส่ Header ไว้เลย
            sheetNames.forEach(sheet => {
                dataGroups[sheet] = [headers]; 
            });

            // วนลูปอ่านข้อมูลในตารางตั้งแต่บรรทัดที่ 2 เป็นต้นไป (ข้าม Header)
            for (let i = 1; i < rows.length; i++) {
                const cells = rows[i].querySelectorAll("td");
                const rowData = [];
                cells.forEach(td => rowData.push(td.innerText));

                // ดึงค่า Order No ออกมาเช็ค (อยู่ในคอลัมน์ที่ 2 หรือ index 1)
                const orderNo = rowData[1] || ""; 
                let matched = false;

                // เช็คว่า Order No ขึ้นต้นด้วยคำไหน แล้วจับใส่กลุ่มนั้น
                for (const prefix of sheetNames) {
                    if (prefix !== "Others" && orderNo.startsWith(prefix)) {
                        dataGroups[prefix].push(rowData);
                        matched = true;
                        break;
                    }
                }
                
                // ถ้าไม่ตรงกับกลุ่มหลักเลย ให้ไปอยู่ใน Sheet "Others"
                if (!matched) {
                    dataGroups["Others"].push(rowData);
                }
            }

            // สร้างไฟล์ Excel Workbook จำลอง
            const wb = XLSX.utils.book_new();

            // นำข้อมูลแต่ละกลุ่มมาสร้างเป็น Sheet ยัดลงไปในไฟล์ Excel
            sheetNames.forEach(sheet => {
                // จะสร้าง Sheet เฉพาะกลุ่มที่มีข้อมูล (เช็คว่ามีแถวมากกว่า 1 คือมีข้อมูลที่ไม่ใช่แค่ Header)
                if (dataGroups[sheet].length > 1) {
                    const ws = XLSX.utils.aoa_to_sheet(dataGroups[sheet]);
                    
                    // ปรับความกว้างคอลัมน์ให้อ่านง่ายขึ้น (Option เสริม)
                    ws['!cols'] = [{wch: 15}, {wch: 20}, {wch: 20}, {wch: 10}];
                    
                    XLSX.utils.book_append_sheet(wb, ws, sheet);
                }
            });

            // สั่งดาวน์โหลดไฟล์
            XLSX.writeFile(wb, "JAGUAR_PRODUCTION_Report.xlsx");
        }
    </script>
</body>
</html>
